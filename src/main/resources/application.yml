# ═══════════════════════════════════════════════════════════════════════════════
# SubPulse — Application Configuration
# Profiles: dev (default) | prod
# ═══════════════════════════════════════════════════════════════════════════════

spring:
  application:
    name: SubPulse
  profiles:
    active: dev   # Switch to 'prod' on deployment

# ───────────────────────────────────────────────────────────────────────────────
# DEV PROFILE — Local development settings
# ───────────────────────────────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: dev

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  datasource:
    url: jdbc:postgresql://localhost:5432/subpulse_dev
    username: postgres
    password: root
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      schema: subpulse

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: update       # Auto-creates/updates tables in dev
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  data:
    redis:
      host: localhost
      port: 6379
      timeout: 2000ms

  # ── Email (Gmail SMTP) ──────────────────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:jrjarvis1999@gmail.com}
    password: ${MAIL_PASSWORD:abcd efgh ijkl mnop}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: subpulse-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: 8080

# ── JWT Configuration ─────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET:myDevSecretKeyThatIsAtLeast256BitsLong1234567890ABCDEF}
    expiration-ms: 86400000        # 24 hours
    refresh-expiration-ms: 604800000  # 7 days

# ── Swagger / OpenAPI ─────────────────────────────────────────────────────────
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.subpulse: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG

# ───────────────────────────────────────────────────────────────────────────────
# PROD PROFILE — All values from environment variables (never hardcode secrets!)
# ───────────────────────────────────────────────────────────────────────────────
---
spring:
  config:
    activate:
      on-profile: prod

  # ── PostgreSQL Database ─────────────────────────────────────────────────────
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 30000

  # ── JPA / Hibernate ─────────────────────────────────────────────────────────
  jpa:
    hibernate:
      ddl-auto: validate     # Never auto-alter schema in prod — use Flyway
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

  # ── Redis Cache ─────────────────────────────────────────────────────────────
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms

  # ── Email (Gmail SMTP) ──────────────────────────────────────────────────────
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

  # ── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS}
    consumer:
      group-id: subpulse-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

# ── Server ────────────────────────────────────────────────────────────────────
server:
  port: ${PORT:8080}
  error:
    include-stacktrace: never  # Never expose stack traces in prod

# ── JWT Configuration ─────────────────────────────────────────────────────────
app:
  jwt:
    secret: ${JWT_SECRET}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000}

# ── Swagger / OpenAPI (disabled in prod for security) ────────────────────────
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false

# ── Logging ───────────────────────────────────────────────────────────────────
logging:
  level:
    com.subpulse: INFO
    org.springframework.security: WARN
